modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}

Seven legendary, never-before-seen nuclear bombs:
- Quantum Singularity Bomb (قنبلة التفرد الكمي)
- Chronos Vortex Bomb (قنبلة دوامة الزمن)
- Crystal Shard Bomb (قنبلة منشور البلورة)
- Void Echo Bomb (قنبلة صدى الفراغ)
- Stellar Core Bomb (قنبلة قلب النجم)
- Glow Spore Bomb (قنبلة الأبواغ المتوهجة)
- Aurora Bomb (قنبلة الشفق القطبي)
'''

[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
